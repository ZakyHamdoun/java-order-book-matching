name: Documentation

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'src/**'
      - 'pom.xml'
      - 'README.md'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'src/**'
      - 'pom.xml'
      - 'README.md'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: documentation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: docs/requirements.txt
      - name: Install documentation dependencies
        run: python -m pip install -r docs/requirements.txt
      - name: Build documentation (warnings are errors)
        run: python -m sphinx -n -W -b html docs docs/_build/html
      - uses: actions/upload-artifact@v4
        with:
          name: documentation-html
          path: docs/_build/html
          include-hidden-files: true
          if-no-files-found: error

  publish:
    needs: build
    if: >-
      github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/main' &&
      github.repository == 'ZakyHamdoun/java-order-book-matching'
    runs-on: ubuntu-latest
    environment:
      name: documentation
      url: https://zakyhamdoun.github.io/java/order-book-matching-engine/
    steps:
      - name: Check publishing credential
        env:
          PAGES_DEPLOY_TOKEN: ${{ secrets.PAGES_DEPLOY_TOKEN }}
        run: |
          if [ -z "$PAGES_DEPLOY_TOKEN" ]; then
            echo '::error::Set PAGES_DEPLOY_TOKEN and prepare the user-site gh-pages branch as described in docs/publishing.rst.'
            exit 1
          fi
      - name: Check out the static user-site branch
        uses: actions/checkout@v6
        with:
          repository: ZakyHamdoun/ZakyHamdoun.github.io
          ref: gh-pages
          token: ${{ secrets.PAGES_DEPLOY_TOKEN }}
          path: user-site
      - uses: actions/download-artifact@v4
        with:
          name: documentation-html
          path: rendered-docs
      - name: Update only this guide's directory
        run: |
          test -f rendered-docs/index.html
          mkdir -p user-site/java/order-book-matching-engine
          rsync -a --delete rendered-docs/ user-site/java/order-book-matching-engine/
          touch user-site/.nojekyll
      - name: Commit and publish
        working-directory: user-site
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- .nojekyll java/order-book-matching-engine
          if git diff --cached --quiet; then
            echo 'Documentation is already up to date.'
            exit 0
          fi
          git commit -m "Update order book documentation from ${GITHUB_SHA}"
          git push origin HEAD:gh-pages
